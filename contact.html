<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Petcharat Saikrajang</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">My Resume</a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm">กลับหน้าแรก</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <section class="card p-4 shadow-sm">
            <h2 class="mb-4">ฟอร์มติดต่อเรา (Contact Form)</h2>
            
            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">ชื่อ - นามสกุล</label>
                    <input type="text" class="form-control" id="name" placeholder="กรอกชื่อของคุณ" required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">อีเมล (Email)</label>
                    <input type="email" class="form-control" id="email" placeholder="name@gmail.com" required>
                </div>
                
                <div class="mb-3">
                    <label for="message" class="form-label fw-bold">ข้อความถึงผม</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="พิมพ์ข้อความที่ต้องการติดต่อ..." required></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">ส่งข้อความ</button>
            </form>
        </section>
    </main>

    <footer class="bg-primary text-white pt-4 pb-2 text-center">
        <div class="container">
            <p class="copyright text-light small">&copy; 2026 Petcharat Saikrajang. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
